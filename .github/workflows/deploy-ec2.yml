name: Deploy to EC2

on:
  push:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: 22
          timeout: 300s
          script: |
            set -e

            echo "=== Starting deployment ==="

            # アプリケーションディレクトリに移動
            cd /var/www/laravel12-otel-ec2-xray

            # Git pullして最新のコードを取得
            echo "Pulling latest code..."
            sudo -u nginx git pull origin main

            # Composerの依存関係を更新
            echo "Installing Composer dependencies..."
            sudo -u nginx composer install --no-dev --optimize-autoloader --no-interaction

            # 環境設定ファイルを更新
            echo "Updating environment file..."
            sudo -u nginx cp .env.example .env.temp

            # 環境変数を設定
            sudo -u nginx tee .env > /dev/null <<EOF
            APP_NAME=Laravel
            APP_ENV=production
            APP_KEY=${{ secrets.APP_KEY }}
            APP_DEBUG=false
            APP_URL=http://${{ secrets.EC2_HOST }}

            LOG_CHANNEL=stack
            LOG_LEVEL=info

            DB_CONNECTION=pgsql
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=5432
            DB_DATABASE=laravel
            DB_USERNAME=postgres
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}

            BROADCAST_DRIVER=log
            CACHE_DRIVER=file
            FILESYSTEM_DISK=local
            QUEUE_CONNECTION=sync
            SESSION_DRIVER=database
            SESSION_LIFETIME=120

            # OpenTelemetry設定
            OTEL_SERVICE_NAME=laravel-app
            OTEL_SERVICE_VERSION=1.0.0
            OTEL_ENVIRONMENT=production
            OTEL_RESOURCE_ATTRIBUTES=service.name=laravel-app,service.version=1.0.0,deployment.environment=production
            OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4317
            OTEL_EXPORTER_OTLP_PROTOCOL=grpc
            OTEL_TRACES_EXPORTER=otlp
            OTEL_METRICS_EXPORTER=otlp
            OTEL_LOGS_EXPORTER=otlp
            OTEL_TRACES_ENABLED=true
            OTEL_METRICS_ENABLED=true
            OTEL_LOGS_ENABLED=true

            # X-Ray設定
            OTEL_XRAY_ENABLED=true
            OTEL_XRAY_DAEMON_ADDRESS=127.0.0.1:2000
            OTEL_EXPORTERS=otlp,xray
            EOF

            # Laravel設定の更新
            echo "Updating Laravel configuration..."
            sudo -u nginx php artisan config:cache
            sudo -u nginx php artisan route:cache
            sudo -u nginx php artisan view:cache

            # データベースマイグレーション
            echo "Running database migrations..."
            sudo -u nginx php artisan migrate --force

            # 権限設定
            echo "Setting permissions..."
            sudo chown -R nginx:nginx /var/www/laravel12-otel-ec2-xray
            sudo chmod -R 755 /var/www/laravel12-otel-ec2-xray
            sudo chmod -R 775 /var/www/laravel12-otel-ec2-xray/storage
            sudo chmod -R 775 /var/www/laravel12-otel-ec2-xray/bootstrap/cache

            # OpenTelemetry Collectorの設定更新
            echo "Updating OpenTelemetry Collector configuration..."
            sudo cp /var/www/laravel12-otel-ec2-xray/docker/otel-collector/otel-collector-config.ec2.yaml /etc/otel-collector/config.yaml

            # サービスの再起動
            echo "Restarting services..."
            sudo systemctl restart php-fpm
            sudo systemctl restart nginx
            sudo systemctl restart otel-collector
            sudo systemctl restart xray

            # サービス状態の確認
            echo "Checking service status..."
            sudo systemctl status php-fpm --no-pager
            sudo systemctl status nginx --no-pager
            sudo systemctl status otel-collector --no-pager
            sudo systemctl status xray --no-pager

            # ヘルスチェック
            echo "Performing health check..."
            sleep 5
            curl -f http://localhost/ || echo "Health check failed"

            echo "=== Deployment completed ==="

      - name: Notify deployment status
        if: always()
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: 22
          timeout: 30s
          script: |
            echo "=== Deployment Summary ==="
            echo "Deployment Status: ${{ job.status }}"
            echo "Deployment Time: $(date)"
            echo "Git Commit: ${{ github.sha }}"
            echo "Branch: ${{ github.ref_name }}"
            echo "=========================="

            # ログの確認
            echo "Recent application logs:"
            sudo tail -n 10 /var/www/laravel12-otel-ec2-xray/storage/logs/laravel.log || echo "No application logs found"

            echo "Recent X-Ray daemon logs:"
            sudo journalctl -u xray --no-pager -n 5 || echo "No X-Ray logs found"

            echo "Recent OpenTelemetry Collector logs:"
            sudo journalctl -u otel-collector --no-pager -n 5 || echo "No OTel Collector logs found"
