receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 50
    send_batch_max_size: 100

  resource:
    attributes:
      - key: environment
        value: production
        action: upsert
      - key: service.name
        value: laravel-app
        action: upsert
      - key: cloud.provider
        value: aws
        action: upsert
      - key: cloud.platform
        value: aws_ec2
        action: upsert
      - key: cloud.region
        value: ap-northeast-1
        action: upsert

exporters:
  # AWS X-Ray exporter（EC2環境用）
  awsxray:
    region: ap-northeast-1
    local_mode: true
    endpoint: ""
    index_all_attributes: true
    no_verify_ssl: false

  # Debug exporter（デバッグ用）
  debug:
    verbosity: normal

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, pprof, zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [awsxray, debug]
    metrics:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [awsxray, debug]
    logs:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [awsxray, debug]
