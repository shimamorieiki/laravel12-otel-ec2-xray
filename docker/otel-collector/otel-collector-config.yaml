receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

  resource:
    attributes:
      - key: environment
        value: ${env:OTEL_ENVIRONMENT}
        action: upsert
      - key: service.name
        value: ${env:OTEL_SERVICE_NAME}
        action: upsert
      - key: cloud.provider
        value: aws
        action: upsert
      - key: cloud.platform
        value: aws_ec2
        action: upsert

exporters:
  # Debug exporter（開発用）
  debug:
    verbosity: detailed

  # AWS X-Ray exporter（トレースのみ）
  awsxray:
    region: ${env:AWS_DEFAULT_REGION}
    local_mode: ${env:OTEL_XRAY_LOCAL_MODE}
    endpoint: ${env:OTEL_XRAY_ENDPOINT}
    index_all_attributes: true
    no_verify_ssl: false

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, pprof, zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [debug, awsxray]
    metrics:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [debug]
